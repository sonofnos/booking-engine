name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_engine
        ports: ['5438:5432']
        options: >-
          --health-cmd "pg_isready -U booking" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5438
      DB_USERNAME: booking
      DB_PASSWORD: booking
      DB_NAME: booking_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
