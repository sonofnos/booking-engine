services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_engine
    ports:
      - '5438:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking']
      interval: 5s
      timeout: 5s
      retries: 5
